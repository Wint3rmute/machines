# https://docs.helix-editor.com/configuration.html
theme = "base16_transparent"
[editor]
line-number = "relative"
mouse = true

[editor.file-picker]
hidden = false

[keys.normal]
"0" = "goto_line_start"
"C-r" = "redo"
r = ":reflow"
# "g" = ":reflow"
# ":e" = ":reload"

"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

[keys.normal.space]
"q" = ":quit"
"/" = "toggle_comments"
"s" = "global_search"

[keys.normal."+"]
l = ":run-shell-command git pull -r"
